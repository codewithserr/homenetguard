[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homenetguard"
version = "0.1.0"
description = "Open-source network security monitor for home and personal use"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HomeNetGuard Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "pyshark>=0.6",
    "flask>=3.0",
    "flask-socketio>=5.3",
    "flask-restx>=1.3",
    "simple-websocket>=1.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "geoip2>=4.7",
    "jinja2>=3.1",
    "weasyprint>=60.0",
    "tabulate>=0.9",
    "python-telegram-bot>=20.0",
    "apprise>=1.7",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "pytest-asyncio>=0.21",
]

[project.scripts]
homenetguard = "homenetguard.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["homenetguard*"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "integration: tests requiring system resources",
    "slow: tests that take >5s",
]

[tool.coverage.run]
omit = [
    # Require real network hardware / packet capture interface
    "homenetguard/capture/sniffer.py",
    "homenetguard/capture/pcap_reader.py",
    "homenetguard/network/flow_correlator.py",
    "homenetguard/network/gateway_monitor.py",
    # Require interactive terminal
    "homenetguard/tui/live_monitor.py",
    # Not yet covered by test suite
    "homenetguard/export/siem_exporter.py",
]
