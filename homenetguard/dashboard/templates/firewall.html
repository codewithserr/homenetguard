{% extends "base.html" %}
{% block title %}Firewall — HomeNetGuard{% endblock %}
{% block content %}

<div class="page-header">
  <span class="page-title">FIREWALL</span>
</div>

<div class="grid-2" style="align-items:start;">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">ACTIVE RULES</span>
      <button class="btn btn-ghost" style="font-size:0.65rem;padding:3px 8px;" onclick="loadRules()">Refresh</button>
    </div>
    <div class="table-scroll" style="max-height:50vh;">
      <table class="data-table">
        <thead><tr><th>ID</th><th>TYPE</th><th>TARGET</th><th>DIR</th><th>REASON</th><th></th></tr></thead>
        <tbody id="rules-tbody"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><span class="panel-title">ADD RULE</span></div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div>
        <label style="font-size:0.72rem;color:var(--text-secondary);display:block;margin-bottom:4px;">TARGET IP</label>
        <input class="filter-input" id="rule-target" placeholder="e.g. 1.2.3.4" style="width:100%;">
      </div>
      <div>
        <label style="font-size:0.72rem;color:var(--text-secondary);display:block;margin-bottom:4px;">DIRECTION</label>
        <select class="filter-select" id="rule-direction" style="width:100%;">
          <option value="both">Both</option>
          <option value="inbound">Inbound</option>
          <option value="outbound">Outbound</option>
        </select>
      </div>
      <div>
        <label style="font-size:0.72rem;color:var(--text-secondary);display:block;margin-bottom:4px;">REASON</label>
        <input class="filter-input" id="rule-reason" placeholder="Reason for block" style="width:100%;">
      </div>
      <button class="btn btn-danger" onclick="addRule()">Block IP</button>
    </div>
  </div>
</div>

<script>
async function loadRules() {
  const res = await fetch('/api/v2/firewall/rules');
  const rules = await res.json();
  const tbody = document.getElementById('rules-tbody');
  if (!rules.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No active rules</td></tr>`;
    return;
  }
  tbody.innerHTML = rules.map(r => `
    <tr>
      <td class="text-mono">${r.id}</td>
      <td><span class="badge badge-tcp">${r.rule_type}</span></td>
      <td class="ip-address">${r.target}</td>
      <td style="font-size:0.72rem;">${r.direction||'—'}</td>
      <td style="font-size:0.72rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;">${r.reason||'—'}</td>
      <td><button class="btn btn-danger" style="font-size:0.62rem;padding:2px 6px;" onclick="deleteRule(${r.id})">✕</button></td>
    </tr>`).join('');
}

async function addRule() {
  const target = document.getElementById('rule-target').value.trim();
  const direction = document.getElementById('rule-direction').value;
  const reason = document.getElementById('rule-reason').value.trim();
  if (!target) { alert('Target IP required'); return; }
  const res = await fetch('/api/v2/firewall/rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ type: 'ip', target, direction, reason }),
  });
  const data = await res.json();
  if (data.ok) { loadRules(); document.getElementById('rule-target').value = ''; }
  else alert('Error: ' + (data.error || 'unknown'));
}

async function deleteRule(id) {
  if (!confirm(`Delete rule #${id}?`)) return;
  await fetch(`/api/v2/firewall/rules/${id}`, { method: 'DELETE' });
  loadRules();
}

loadRules();
</script>
{% endblock %}
