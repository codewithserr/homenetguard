{% extends "base.html" %}
{% block title %}Reports — HomeNetGuard{% endblock %}
{% block content %}

<div class="page-header">
  <h1 class="page-title">Reports</h1>
  <button class="btn" onclick="document.getElementById('new-report-modal').classList.remove('hidden')">+ Generate Report</button>
</div>

<div class="grid-2" style="align-items:start;">

  <div class="panel corner-bracket" style="min-width:0;">
    <div class="panel-header">
      <span class="panel-title">GENERATED REPORTS</span>
      <span class="text-muted" id="report-count" style="font-size:11px;"></span>
    </div>
    <div id="reports-list">
      <div class="empty-state"><span class="empty-state-icon">📋</span>No reports yet</div>
    </div>
    <div class="cb-bottom"></div>
  </div>

  <div class="panel corner-bracket" id="viewer-panel" style="min-width:0;">
    <div class="panel-header">
      <span class="panel-title" id="viewer-title">REPORT VIEWER</span>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" id="viewer-download-btn" style="display:none;font-size:10px;padding:3px 8px;"
                onclick="downloadReport()">↓ Download</button>
        <button class="btn-ghost" style="font-size:10px;padding:3px 8px;"
                onclick="clearViewer()">✕ Close</button>
      </div>
    </div>
    <div id="viewer-placeholder" style="padding:60px;text-align:center;color:var(--outline);">
      <div style="font-size:2rem;opacity:0.2;margin-bottom:8px;">📄</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;">Select a report to preview</div>
    </div>
    <iframe id="report-iframe"
            style="display:none;width:100%;height:75vh;border:none;border-radius:3px;background:#fff;"
            sandbox="allow-same-origin allow-scripts">
    </iframe>
    <div class="cb-bottom"></div>
  </div>

</div>

<div class="modal-overlay hidden" id="new-report-modal"
     onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal" style="width:420px;">
    <div class="modal-header">
      <span class="modal-title">GENERATE REPORT</span>
      <button class="modal-close" onclick="document.getElementById('new-report-modal').classList.add('hidden')">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--outline);display:block;margin-bottom:6px;">TYPE</label>
        <select class="filter-select" id="rpt-type" style="width:100%;">
          <option value="daily">Daily (last 24h)</option>
          <option value="weekly">Weekly (last 7d)</option>
          <option value="custom">Custom period</option>
        </select>
      </div>
      <div id="custom-dates" style="display:none;gap:8px;flex-direction:column;">
        <div>
          <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--outline);display:block;margin-bottom:6px;">FROM</label>
          <input type="date" class="filter-input" id="rpt-from" style="width:100%;">
        </div>
        <div>
          <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--outline);display:block;margin-bottom:6px;">TO</label>
          <input type="date" class="filter-input" id="rpt-to" style="width:100%;">
        </div>
      </div>
      <div>
        <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--outline);display:block;margin-bottom:6px;">FORMAT</label>
        <select class="filter-select" id="rpt-format" style="width:100%;">
          <option value="html">HTML only</option>
          <option value="pdf">PDF only</option>
          <option value="both">HTML + PDF</option>
        </select>
      </div>
      <div id="gen-status" style="display:none;font-size:12px;color:var(--surface-tint);font-family:'JetBrains Mono',monospace;">⟳ Generating...</div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn" onclick="generateReport()" style="flex:1;justify-content:center;" id="gen-btn">Generate</button>
        <button class="btn-ghost" onclick="document.getElementById('new-report-modal').classList.add('hidden')">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
let _currentReportId = null;
let _currentFilePath = null;

document.getElementById('rpt-type').addEventListener('change', function() {
  document.getElementById('custom-dates').style.display =
    this.value === 'custom' ? 'flex' : 'none';
});

async function loadReports() {
  const res = await fetch('/api/reports');
  const reports = await res.json();
  const list = document.getElementById('reports-list');
  document.getElementById('report-count').textContent = `${reports.length} report${reports.length !== 1 ? 's' : ''}`;

  if (!reports.length) {
    list.innerHTML = `<div class="empty-state"><span class="empty-state-icon">📋</span>No reports yet — click Generate to create one</div>`;
    return;
  }

  list.innerHTML = reports.map(r => `
    <div class="report-item ${_currentReportId === r.id ? 'active' : ''}"
         id="report-item-${r.id}"
         onclick="viewReport(${r.id}, ${JSON.stringify(r.file_path || '')}, ${JSON.stringify(r.report_type)}, ${JSON.stringify(r.format || 'html')})">
      <div class="report-meta">
        <div class="report-name">
          <span class="badge badge-tcp" style="margin-right:6px;">${r.report_type}</span>
          ${r.format === 'pdf' ? '<span class="badge badge-low">PDF</span>' : '<span class="badge badge-medium" style="color:var(--accent-primary)">HTML</span>'}
        </div>
        <div class="report-sub">
          ${r.period_start ? r.period_start.slice(0,10) + ' → ' + (r.period_end || '').slice(0,10) : 'Period not set'}
          &nbsp;·&nbsp; ${r.created_at.slice(0,16).replace('T', ' ')} UTC
        </div>
      </div>
      <div class="report-actions">
        <button class="btn" style="font-size:0.65rem;padding:3px 8px;"
                onclick="event.stopPropagation();viewReport(${r.id}, ${JSON.stringify(r.file_path || '')}, ${JSON.stringify(r.report_type)}, ${JSON.stringify(r.format || 'html')})">
          👁 View
        </button>
        ${r.file_path ? `<button class="btn-ghost" style="font-size:0.65rem;padding:3px 8px;"
                onclick="event.stopPropagation();window.open('/api/reports/${r.id}/download', '_blank')">↓</button>` : ''}
      </div>
    </div>
  `).join('');
}

function viewReport(reportId, filePath, reportType, fmt) {
  _currentReportId = reportId;
  _currentFilePath = filePath;

  document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById(`report-item-${reportId}`);
  if (item) item.classList.add('active');

  const iframe = document.getElementById('report-iframe');
  const placeholder = document.getElementById('viewer-placeholder');
  const title = document.getElementById('viewer-title');
  const dlBtn = document.getElementById('viewer-download-btn');

  title.textContent = `REPORT — ${reportType.toUpperCase()}`;
  placeholder.style.display = 'none';
  iframe.style.display = 'block';
  iframe.src = `/api/reports/${reportId}/content`;
  dlBtn.style.display = filePath ? 'flex' : 'none';
}

function clearViewer() {
  _currentReportId = null;
  _currentFilePath = null;
  document.getElementById('report-iframe').style.display = 'none';
  document.getElementById('viewer-placeholder').style.display = 'block';
  document.getElementById('viewer-title').textContent = 'REPORT VIEWER';
  document.getElementById('viewer-download-btn').style.display = 'none';
  document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
}

function downloadReport() {
  if (_currentReportId) {
    window.open(`/api/reports/${_currentReportId}/content`, '_blank');
  }
}

async function generateReport() {
  const type = document.getElementById('rpt-type').value;
  const fmt = document.getElementById('rpt-format').value;
  const dateFrom = document.getElementById('rpt-from').value;
  const dateTo = document.getElementById('rpt-to').value;

  const genBtn = document.getElementById('gen-btn');
  const status = document.getElementById('gen-status');
  genBtn.disabled = true;
  status.style.display = 'block';

  try {
    const body = { type, format: fmt };
    if (type === 'custom' && dateFrom) body.date_from = dateFrom;
    if (type === 'custom' && dateTo) body.date_to = dateTo;

    const res = await fetch('/api/reports/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    document.getElementById('new-report-modal').classList.add('hidden');

    if (data.ok) {
      await loadReports();
      const reports = await (await fetch('/api/reports')).json();
      if (reports.length) {
        const newest = reports[0];
        viewReport(newest.id, newest.file_path, newest.report_type, newest.format || 'html');
      }
    } else {
      alert('Report generation failed: ' + (data.error || 'unknown error'));
    }
  } finally {
    genBtn.disabled = false;
    status.style.display = 'none';
  }
}

loadReports();
</script>
{% endblock %}
